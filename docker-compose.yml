services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travelgenie_db
      POSTGRES_USER: travelgenie
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelgenie -d travelgenie_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >-
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn travelgenie.wsgi:application --bind 0.0.0.0:8000 --timeout 120 --workers 2"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
